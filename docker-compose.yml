# ============================================================
# Bersabeh Clinic Platform — Local development infrastructure
# ============================================================
# Run:    docker compose up -d
# Stop:   docker compose down
# Wipe:   docker compose down -v   (deletes database + emails)
# Logs:   docker compose logs -f [service-name]
# ============================================================

name: bersabeh

services:

  # ------------------------------------------------------------
  # PostgreSQL 16 — the clinic database
  # ------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: bersabeh_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bersabeh
      POSTGRES_PASSWORD: bersabeh_dev_password
      POSTGRES_DB: bersabeh_db
      # Use a deterministic collation so migrations are reproducible
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bersabeh -d bersabeh_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ------------------------------------------------------------
  # MailHog — fake SMTP + web inbox for development
  # Catches every outgoing email so we never spam real addresses.
  # Web UI:   http://localhost:8025
  # SMTP:     localhost:1025  (no auth, no TLS)
  # ------------------------------------------------------------
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: bersabeh_mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    environment:
      MH_STORAGE: memory

  # ------------------------------------------------------------
  # pgAdmin 4 — GUI for browsing the database
  # Web UI:   http://localhost:5050
  # Login:    admin@bersabeh.local / admin
  # ------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: bersabeh_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@bersabeh.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

# ------------------------------------------------------------
# Named volumes — persist data across container restarts.
# `docker compose down -v` destroys these on purpose.
# ------------------------------------------------------------
volumes:
  postgres_data:
    name: bersabeh_postgres_data
  pgadmin_data:
    name: bersabeh_pgadmin_data
